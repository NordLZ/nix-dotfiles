#############################################
# mangowm config.conf — "dwm defaults" port
#
# Mirrors dwm's stock config.h as closely as
# mango's dispatcher set allows:
#   - Alt (Mod1) as the modkey, like MODKEY in dwm
#   - st + dmenu_run, dwm's default term/launcher
#   - tile / monocle layouts, mfact 0.55, nmaster 1
#   - no gaps, 1px borders, gray/blue color scheme
#   - the classic dwm keybind layout (j/k, h/l, etc.)
#
# Install location: ~/.config/mango/config.conf
#############################################

### Programs (swap these if you don't use st/dmenu) ###
bind=SUPER,Return,spawn,alacritty
#bind=SUPER,d,spawn,wmenu-run
bind=SUPER,r,reload_config

### Focus / stack navigation (dwm: j/k) ###
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

### Master area control (dwm: i/d/h/l) ###
bind=ALT,i,incnmaster,+1
bind=ALT,p,incnmaster,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,+0.05

### Zoom focused window into master (dwm: Return) ###
bind=ALT,Return,zoom

### Jump back to previous tag (dwm: Tab) ###
bind=ALT,Tab,view,-1

### Kill focused window (dwm: Shift+c) ###
bind=SUPER,q,killclient

### Layouts (dwm: t/f/m/space) ###
circle_layout=tile,monocle
bind=ALT,t,setlayout,tile
bind=ALT,m,setlayout,monocle
bind=ALT,f,togglefloating
bind=ALT,space,switch_layout
bind=ALT+SHIFT,space,togglefloating

### View / tag all (dwm: 0 / Shift+0) ###
bind=ALT,0,view,0
bind=ALT+SHIFT,0,toggletag,0

### Monitor focus / move window to monitor (dwm: comma/period) ###
bind=ALT,comma,focusmon,left
bind=ALT,period,focusmon,right
bind=ALT+SHIFT,comma,tagmon,left
bind=ALT+SHIFT,period,tagmon,right

### Quit (dwm: Shift+q) ###
bind=SUPER+SHIFT,q,quit

### Tags 1-9 (dwm: view / toggleview / tag / toggletag) ###
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

bind=SUPER+CTRL+SHIFT,1,toggletag,1
bind=SUPER+CTRL+SHIFT,2,toggletag,2
bind=SUPER+CTRL+SHIFT,3,toggletag,3
bind=SUPER+CTRL+SHIFT,4,toggletag,4
bind=SUPER+CTRL+SHIFT,5,toggletag,5
bind=SUPER+CTRL+SHIFT,6,toggletag,6
bind=SUPER+CTRL+SHIFT,7,toggletag,7
bind=SUPER+CTRL+SHIFT,8,toggletag,8
bind=SUPER+CTRL+SHIFT,9,toggletag,9

# Give each tag the tile layout by default (dwm starts every tag tiled)
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

### Mouse bindings (dwm: Mod+drag to move/resize, Mod+middle to float) ###
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
mousebind=ALT,btn_middle,togglefloating

### Layout math — dwm's stock values ###
default_mfact=0.55
default_nmaster=1
new_is_master=1
smartgaps=0

### Borders — dwm's stock gray/blue scheme, 1px border, no gaps ###
borderpx=1
no_border_when_single=0
gappih=0
gappiv=0
gappoh=0
gappov=0

rootcolor=0x222222ff
bordercolor=0x444444ff
focuscolor=0x005577ff
urgentcolor=0xff0000ff

### Behavior — dwm doesn't do sloppy/hover focus or animations ###
animations=0
sloppyfocus=1
warpcursor=1
snap_distance=32
enable_floating_snap=1

# trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Core binds
bind=SUPER,d,spawn,noctalia msg panel-toggle launcher
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

# Define two layouts: US QWERTY and US Dvorak
#xkb_rules_layout=us,sv
#bind=SUPER,SPACE,switch_keyboard_layout

### Autostart ###
# dwm draws its own status text in the bar; mango needs an external bar
# for the same effect. Uncomment if you want one:
exec-once=swaybg -m stretch -i ~/.nixos-dotfiles/assets/lighthouse.jpg
exec-once=noctalia
