log_level = "warn"

position = "Top"

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = [ "Tempo" ]

[window_title]
mode = "Title"                     # "Title", "Class", "InitialTitle", "InitialClass"
truncate_title_after_length = 60

[tempo]
clock_format = "%a %d %b  %H:%M"   # e.g. "Sun 02 Aug  14:35"

[workspaces]
visibility_mode = "All"
enable_workspace_filling = false

[appearance]
style = "Solid"                    # solid bar, no islands
primary_color = "#7aa2f7"          # tokyo night blue
success_color = "#9ece6a"          # tokyo night green
warning_color = "#e0af68"          # tokyo night orange
danger_color = "#f7768e"           # tokyo night red
text_color = "#c0caf5"             # tokyo night foreground
workspace_colors = [ "#7aa2f7", "#bb9af7" ]   # blue -> purple for active workspaces

[appearance.background_color]
base = "#1a1b26"                   # tokyo night background
weak = "#24283b"
strong = "#414868"
